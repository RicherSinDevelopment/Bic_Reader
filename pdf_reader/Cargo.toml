[package]
name = "pdf_reader"
version = "0.2.0"
edition = "2024"

[lib]
name = "bic_pdf_reader"
crate-type = ["rlib", "staticlib"]

[features]
default = []
ios-static = ["pdfium-render/static"]

[dependencies]
pdfium-render = "0.8"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
